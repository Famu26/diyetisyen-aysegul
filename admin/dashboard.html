<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --sage:#6B8F64;--sage-pale:#DCE9DA;
  --beige:#E8DDD0;--beige-light:#FAF8F5;--beige-mid:#F0E9E0;
  --espresso:#2C1F14;--espresso-mid:#5A3E2B;--espresso-light:#8B6E56;
  --white:#fff;
}
body{font-family:'Inter',sans-serif;background:var(--beige-light);color:var(--espresso);min-height:100vh;opacity:0;transition:opacity .2s}
body.ready{opacity:1}

/* NAV */
nav{background:var(--espresso);padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:100}
.nav-l{display:flex;align-items:center;gap:1.8rem}
.nav-logo{display:flex;align-items:center;gap:.7rem;text-decoration:none}
.nav-logo img{height:32px;width:auto;filter:brightness(0) invert(1) opacity(.85)}
.nav-logo span{font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.35);font-weight:500}
.nav-links{display:flex;gap:1.2rem;list-style:none}
.nav-links a{font-size:.72rem;letter-spacing:.08em;color:rgba(255,255,255,.5);text-decoration:none;transition:color .2s}
.nav-links a:hover,.nav-links a.active{color:#fff}
.nav-r{display:flex;align-items:center;gap:1rem}
.nav-user{font-size:.72rem;color:rgba(255,255,255,.4);display:none}
@media(min-width:500px){.nav-user{display:block}}
.btn-logout{
  font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
  color:rgba(255,255,255,.6);padding:.35rem .8rem;border-radius:3px;
  cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s
}
.btn-logout:hover{background:rgba(255,255,255,.15);color:#fff}

/* CONTENT */
.wrap{max-width:900px;margin:0 auto;padding:2.5rem 1.5rem}

.page-head{margin-bottom:2rem}
.eyebrow{display:flex;align-items:center;gap:.6rem;margin-bottom:.5rem}
.eyebrow-line{width:22px;height:1px;background:var(--sage)}
.eyebrow-text{font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:var(--sage);font-weight:500}
h1{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:300}
h1 em{font-style:italic;color:var(--sage)}
.sub{font-size:.8rem;color:var(--espresso-light);margin-top:.3rem;font-weight:300}

/* CARDS */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;margin-bottom:2rem}
.card{background:var(--white);border:1px solid var(--beige);border-radius:4px;padding:1.4rem 1.5rem;text-decoration:none;color:inherit;display:block;transition:box-shadow .2s,transform .2s}
.card:hover{box-shadow:0 4px 16px rgba(44,31,20,.07);transform:translateY(-2px)}
.card-num{font-family:'Cormorant Garamond',serif;font-size:2.2rem;font-weight:300;color:var(--espresso);line-height:1}
.card-label{font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:var(--espresso-light);margin-top:.3rem}

/* QUICK ACTIONS */
.actions-head{font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:var(--espresso-light);margin-bottom:.8rem;font-weight:500}
.actions{display:flex;flex-wrap:wrap;gap:.7rem}
.action{
  display:inline-flex;align-items:center;gap:.5rem;
  padding:.6rem 1.1rem;border-radius:3px;
  font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;
  text-decoration:none;font-family:'Inter',sans-serif;transition:all .2s
}
.action.primary{background:var(--espresso);color:var(--white)}
.action.primary:hover{background:var(--sage)}
.action.ghost{background:var(--white);color:var(--espresso-mid);border:1px solid var(--beige)}
.action.ghost:hover{border-color:var(--sage);color:var(--sage)}
</style>
</head>
<body>

<nav>
  <div class="nav-l">
    <a class="nav-logo" href="dashboard.html">
      <img src="../LOGO-2.svg" alt="Logo">
      <span>Admin</span>
    </a>
    <ul class="nav-links">
      <li><a href="dashboard.html" class="active">Dashboard</a></li>
      <li><a href="posts.html">Yazılar</a></li>
    </ul>
  </div>
  <div class="nav-r">
    <span class="nav-user" id="navUser"></span>
    <button class="btn-logout" id="logoutBtn">Çıkış</button>
  </div>
</nav>

<div class="wrap">
  <div class="page-head">
    <div class="eyebrow"><span class="eyebrow-line"></span><span class="eyebrow-text">Genel Bakış</span></div>
    <h1>Merhaba, <em id="welcomeName">Admin</em></h1>
    <p class="sub">Bugün ne yapmak istersiniz?</p>
  </div>

  <div class="cards">
    <div class="card">
      <div class="card-num" id="statPosts">—</div>
      <div class="card-label">Blog Yazısı</div>
    </div>
    <div class="card">
      <div class="card-num" id="statPublished">—</div>
      <div class="card-label">Yayında</div>
    </div>
    <div class="card">
      <div class="card-num" id="statDraft">—</div>
      <div class="card-label">Taslak</div>
    </div>
  </div>

  <p class="actions-head">Hızlı Erişim</p>
  <div class="actions">
    <a href="posts-new.html" class="action primary">+ Yeni Yazı</a>
    <a href="posts.html" class="action ghost">Tüm Yazılar</a>
    <a href="../index.html" target="_blank" class="action ghost">↗ Siteyi Görüntüle</a>
  </div>
</div>

<script type="module">
import { supabase } from '../src/lib/supabase.js'

const { data: { session } } = await supabase.auth.getSession()
if (!session) { location.replace('login.html'); }

const email = session.user.email
document.getElementById('navUser').textContent  = email
document.getElementById('welcomeName').textContent = email.split('@')[0]
document.body.classList.add('ready')

// Stats
const { data: posts } = await supabase.from('posts').select('published')
if (posts) {
  const pub   = posts.filter(p => p.published).length
  const draft = posts.length - pub
  document.getElementById('statPosts').textContent     = posts.length
  document.getElementById('statPublished').textContent = pub
  document.getElementById('statDraft').textContent     = draft
}

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await supabase.auth.signOut()
  location.replace('login.html')
})

supabase.auth.onAuthStateChange(e => {
  if (e === 'SIGNED_OUT') location.replace('login.html')
})
</script>
</body>
</html>
