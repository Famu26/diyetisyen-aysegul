<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yeni Yazı — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --sage:#6B8F64;--sage-pale:#DCE9DA;
  --beige:#E8DDD0;--beige-light:#FAF8F5;--beige-mid:#F0E9E0;
  --espresso:#2C1F14;--espresso-mid:#5A3E2B;--espresso-light:#8B6E56;
  --white:#fff;--red:#C0392B;--red-bg:#FDECEA;
}
body{font-family:'Inter',sans-serif;background:var(--beige-light);color:var(--espresso);min-height:100vh;opacity:0;transition:opacity .2s}
body.ready{opacity:1}

/* NAV */
nav{background:var(--espresso);padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:100}
.nav-l{display:flex;align-items:center;gap:1.8rem}
.nav-logo{display:flex;align-items:center;gap:.7rem;text-decoration:none}
.nav-logo img{height:32px;width:auto;filter:brightness(0) invert(1) opacity(.85)}
.nav-logo span{font-size:.6rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.35);font-weight:500}
.nav-links{display:flex;gap:1.2rem;list-style:none}
.nav-links a{font-size:.72rem;letter-spacing:.08em;color:rgba(255,255,255,.5);text-decoration:none;transition:color .2s}
.nav-links a:hover,.nav-links a.active{color:#fff}
.nav-r{display:flex;align-items:center;gap:1rem}
.nav-user{font-size:.72rem;color:rgba(255,255,255,.4);display:none}
@media(min-width:500px){.nav-user{display:block}}
.btn-logout{
  font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
  color:rgba(255,255,255,.6);padding:.35rem .8rem;border-radius:3px;
  cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s
}
.btn-logout:hover{background:rgba(255,255,255,.15);color:#fff}

/* CONTENT */
.wrap{max-width:720px;margin:0 auto;padding:2.5rem 1.5rem}

.page-head{margin-bottom:2rem}
.breadcrumb{display:flex;align-items:center;gap:.5rem;margin-bottom:.8rem}
.breadcrumb a{font-size:.72rem;color:var(--espresso-light);text-decoration:none;transition:color .2s}
.breadcrumb a:hover{color:var(--sage)}
.breadcrumb span{font-size:.72rem;color:var(--espresso-light)}
h1{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:300}

/* FORM CARD */
.form-card{background:var(--white);border:1px solid var(--beige);border-radius:4px;padding:2rem}

.field{margin-bottom:1.4rem}
.field label{
  display:flex;align-items:center;justify-content:space-between;
  font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--espresso-light);font-weight:500;margin-bottom:.45rem
}
.label-hint{font-size:.6rem;letter-spacing:0;text-transform:none;color:var(--espresso-light);opacity:.7}

.field input[type="text"],
.field input[type="email"] {
  width:100%;padding:.75rem .9rem;
  background:var(--beige-light);border:1px solid var(--beige);border-radius:3px;
  font-family:'Inter',sans-serif;font-size:.88rem;color:var(--espresso);outline:none;
  transition:border-color .25s,box-shadow .25s
}
.field input:focus{border-color:var(--sage);box-shadow:0 0 0 3px var(--sage-pale);background:var(--white)}

.field textarea{
  width:100%;padding:.75rem .9rem;
  background:var(--beige-light);border:1px solid var(--beige);border-radius:3px;
  font-family:'Inter',sans-serif;font-size:.88rem;color:var(--espresso);outline:none;
  resize:vertical;min-height:200px;line-height:1.7;
  transition:border-color .25s,box-shadow .25s
}
.field textarea:focus{border-color:var(--sage);box-shadow:0 0 0 3px var(--sage-pale);background:var(--white)}

/* Checkbox */
.check-row{display:flex;align-items:center;gap:.7rem;padding:.6rem 0}
.check-row input[type="checkbox"]{
  width:16px;height:16px;accent-color:var(--sage);cursor:pointer;flex-shrink:0
}
.check-row .check-label{font-size:.82rem;color:var(--espresso);cursor:pointer;user-select:none}
.check-row .check-sub{font-size:.72rem;color:var(--espresso-light);margin-top:.1rem}

/* DIVIDER */
.divider{height:1px;background:var(--beige-mid);margin:1.6rem 0}

/* BUTTONS */
.form-actions{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.btn-submit{
  padding:.8rem 1.8rem;background:var(--espresso);color:var(--white);
  border:none;border-radius:3px;
  font-family:'Inter',sans-serif;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;
  cursor:pointer;transition:background .2s
}
.btn-submit:hover:not(:disabled){background:var(--sage)}
.btn-submit:disabled{opacity:.5;cursor:not-allowed}
.btn-cancel{
  padding:.8rem 1.2rem;background:transparent;color:var(--espresso-light);
  border:1px solid var(--beige);border-radius:3px;
  font-family:'Inter',sans-serif;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;
  cursor:pointer;transition:all .2s;text-decoration:none;display:inline-flex;align-items:center
}
.btn-cancel:hover{border-color:var(--espresso-light);color:var(--espresso)}

/* ERROR */
.error{display:none;background:var(--red-bg);border:1px solid rgba(192,57,43,.2);border-radius:3px;padding:.65rem .9rem;font-size:.8rem;color:var(--red);margin-bottom:1.2rem}
.error.show{display:block}

/* TOAST */
.toast{
  position:fixed;bottom:1.5rem;right:1.5rem;
  background:var(--espresso);color:#fff;
  padding:.7rem 1.1rem;border-radius:3px;
  font-size:.78rem;opacity:0;transform:translateY(8px);
  transition:all .3s;pointer-events:none;z-index:999
}
.toast.show{opacity:1;transform:translateY(0)}
.toast.ok{background:var(--sage)}
.toast.err{background:var(--red)}
</style>
</head>
<body>

<nav>
  <div class="nav-l">
    <a class="nav-logo" href="dashboard.html">
      <img src="../LOGO-2.svg" alt="Logo">
      <span>Admin</span>
    </a>
    <ul class="nav-links">
      <li><a href="dashboard.html">Dashboard</a></li>
      <li><a href="posts.html" class="active">Yazılar</a></li>
    </ul>
  </div>
  <div class="nav-r">
    <span class="nav-user" id="navUser"></span>
    <button class="btn-logout" id="logoutBtn">Çıkış</button>
  </div>
</nav>

<div class="wrap">
  <div class="page-head">
    <div class="breadcrumb">
      <a href="posts.html">Yazılar</a>
      <span>/</span>
      <span id="breadcrumbLabel">Yeni Yazı</span>
    </div>
    <h1 id="pageTitle">Yeni Yazı Ekle</h1>
  </div>

  <div class="form-card">
    <div class="error" id="err"></div>

    <form id="form">
      <div class="field">
        <label for="title">
          Başlık
          <span class="label-hint">Zorunlu</span>
        </label>
        <input type="text" id="title" placeholder="Blog yazısının başlığı" required>
      </div>

      <div class="field">
        <label for="slug">
          Slug
          <span class="label-hint">Otomatik oluşturulur</span>
        </label>
        <input type="text" id="slug" placeholder="ornek-yazi-basligi">
      </div>

      <div class="field">
        <label for="content">İçerik</label>
        <textarea id="content" placeholder="Yazı içeriğini buraya girin..."></textarea>
      </div>

      <div class="divider"></div>

      <div class="field">
        <label as="div">Yayın Durumu</label>
        <label class="check-row" for="published">
          <input type="checkbox" id="published">
          <div>
            <div class="check-label">Yayında</div>
            <div class="check-sub">İşaretli ise yazı sitede görünür.</div>
          </div>
        </label>
      </div>

      <div class="divider"></div>

      <div class="form-actions">
        <button type="submit" class="btn-submit" id="submitBtn">Kaydet</button>
        <a href="posts.html" class="btn-cancel">İptal</a>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { supabase } from '../src/lib/supabase.js'

// Auth kontrol
const { data: { session } } = await supabase.auth.getSession()
if (!session) { location.replace('login.html'); }

document.getElementById('navUser').textContent = session.user.email
document.body.classList.add('ready')

// Düzenleme modu: URL'de ?id=xxx varsa
const editId = new URLSearchParams(location.search).get('id')
let isEdit = !!editId

if (isEdit) {
  document.getElementById('breadcrumbLabel').textContent = 'Düzenle'
  document.getElementById('pageTitle').textContent       = 'Yazıyı Düzenle'
  document.getElementById('submitBtn').textContent       = 'Güncelle'
  await loadPost(editId)
}

async function loadPost(id) {
  const { data, error } = await supabase
    .from('posts').select('*').eq('id', id).single()

  if (error || !data) {
    showErr('Yazı bulunamadı.')
    return
  }

  document.getElementById('title').value       = data.title     || ''
  document.getElementById('slug').value        = data.slug      || ''
  document.getElementById('content').value     = data.content   || ''
  document.getElementById('published').checked = data.published || false
}

// Slug otomatik oluşturma (başlıktan)
document.getElementById('title').addEventListener('input', e => {
  // Sadece yeni yazıda ve slug boşsa otomatik doldur
  if (!isEdit || document.getElementById('slug').value === '') {
    document.getElementById('slug').value = toSlug(e.target.value)
  }
})

function toSlug(str) {
  return str
    .toLowerCase()
    .replace(/ğ/g,'g').replace(/ü/g,'u').replace(/ş/g,'s')
    .replace(/ı/g,'i').replace(/ö/g,'o').replace(/ç/g,'c')
    .replace(/[^a-z0-9\s-]/g,'')
    .trim()
    .replace(/\s+/g,'-')
    .replace(/-+/g,'-')
}

// Form gönder
document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault()
  hideErr()

  const title     = document.getElementById('title').value.trim()
  const slug      = document.getElementById('slug').value.trim()
  const content   = document.getElementById('content').value
  const published = document.getElementById('published').checked

  if (!title) { showErr('Başlık zorunludur.'); return }

  const btn = document.getElementById('submitBtn')
  btn.disabled    = true
  btn.textContent = isEdit ? 'Güncelleniyor...' : 'Kaydediliyor...'

  let error

  if (isEdit) {
    const res = await supabase
      .from('posts')
      .update({ title, slug: slug || null, content, published })
      .eq('id', editId)
    error = res.error
  } else {
    const res = await supabase
      .from('posts')
      .insert([{ title, slug: slug || null, content, published }])
    error = res.error
  }

  if (error) {
    showErr(error.message)
    btn.disabled    = false
    btn.textContent = isEdit ? 'Güncelle' : 'Kaydet'
    return
  }

  toast(isEdit ? 'Yazı güncellendi.' : 'Yazı eklendi.', 'ok')
  setTimeout(() => location.assign('posts.html'), 1200)
})

function showErr(msg) {
  const el = document.getElementById('err')
  el.textContent = msg
  el.classList.add('show')
  el.scrollIntoView({ behavior:'smooth', block:'center' })
}
function hideErr() {
  document.getElementById('err').classList.remove('show')
}

function toast(msg, type = 'ok') {
  const el = document.getElementById('toast')
  el.textContent = msg
  el.className = `toast show ${type}`
  setTimeout(() => el.classList.remove('show'), 2500)
}

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await supabase.auth.signOut()
  location.replace('login.html')
})
</script>
</body>
</html>
