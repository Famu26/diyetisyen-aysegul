<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Giriş — Ayşegül Tekeli</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --sage:#6B8F64;--sage-pale:#DCE9DA;
  --beige:#E8DDD0;--beige-light:#FAF8F5;--beige-mid:#F0E9E0;
  --espresso:#2C1F14;--espresso-mid:#5A3E2B;--espresso-light:#8B6E56;
  --white:#fff;--red:#C0392B;--red-bg:#FDECEA;
}
body{font-family:'Inter',sans-serif;background:var(--beige-light);color:var(--espresso);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}

.card{width:100%;max-width:380px;background:var(--white);border:1px solid var(--beige);border-radius:4px;padding:2.5rem 2rem}

.card-logo{text-align:center;margin-bottom:2rem}
.card-logo img{height:72px;width:auto}
.card-logo p{font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;color:var(--espresso-light);margin-top:.5rem}

h1{font-family:'Cormorant Garamond',serif;font-size:1.8rem;font-weight:300;text-align:center;margin-bottom:1.8rem}

.error{display:none;background:var(--red-bg);border:1px solid rgba(192,57,43,.2);border-radius:3px;padding:.65rem .9rem;font-size:.8rem;color:var(--red);margin-bottom:1.2rem}
.error.show{display:block}

.field{margin-bottom:1.1rem}
.field label{display:block;font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:var(--espresso-light);font-weight:500;margin-bottom:.4rem}
.field input{
  width:100%;padding:.75rem .9rem;
  background:var(--beige-light);border:1px solid var(--beige);border-radius:3px;
  font-family:'Inter',sans-serif;font-size:.88rem;color:var(--espresso);outline:none;
  transition:border-color .25s,box-shadow .25s
}
.field input:focus{border-color:var(--sage);box-shadow:0 0 0 3px var(--sage-pale);background:var(--white)}

.btn{
  width:100%;padding:.85rem;margin-top:.4rem;
  background:var(--espresso);color:var(--white);border:none;border-radius:3px;
  font-family:'Inter',sans-serif;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;
  cursor:pointer;transition:background .25s
}
.btn:hover:not(:disabled){background:var(--sage)}
.btn:disabled{opacity:.55;cursor:not-allowed}

.back{display:block;text-align:center;margin-top:1.4rem;font-size:.72rem;color:var(--espresso-light);text-decoration:none;transition:color .2s}
.back:hover{color:var(--sage)}
</style>
</head>
<body>

<div class="card">
  <div class="card-logo">
    <img src="../LOGO-2.svg" alt="Logo">
    <p>Admin Panel</p>
  </div>

  <h1>Giriş Yap</h1>

  <div class="error" id="err"></div>

  <form id="form">
    <div class="field">
      <label for="email">E-posta</label>
      <input type="email" id="email" autocomplete="email" required placeholder="admin@example.com">
    </div>
    <div class="field">
      <label for="password">Şifre</label>
      <input type="password" id="password" autocomplete="current-password" required placeholder="••••••••">
    </div>
    <button class="btn" id="btn" type="submit">Giriş Yap</button>
  </form>

  <a class="back" href="../index.html">← Ana Siteye Dön</a>
</div>

<script type="module">
import { supabase } from '../src/lib/supabase.js'

const { data: { session } } = await supabase.auth.getSession()
if (session) location.replace('dashboard.html')

const form = document.getElementById('form')
const btn  = document.getElementById('btn')
const err  = document.getElementById('err')

form.addEventListener('submit', async e => {
  e.preventDefault()
  err.classList.remove('show')
  btn.disabled = true
  btn.textContent = 'Giriş yapılıyor...'

  const { error } = await supabase.auth.signInWithPassword({
    email:    document.getElementById('email').value.trim(),
    password: document.getElementById('password').value
  })

  if (error) {
    err.textContent = tr(error.message)
    err.classList.add('show')
    btn.disabled = false
    btn.textContent = 'Giriş Yap'
    return
  }

  location.replace('dashboard.html')
})

function tr(msg) {
  if (msg.includes('Invalid login credentials')) return 'E-posta veya şifre hatalı.'
  if (msg.includes('Email not confirmed'))       return 'E-posta adresinizi onaylayın.'
  if (msg.includes('Too many requests'))         return 'Çok fazla deneme. Bekleyin.'
  return 'Giriş başarısız. Tekrar deneyin.'
}
</script>
</body>
</html>
